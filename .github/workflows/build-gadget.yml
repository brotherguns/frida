name: build-gadget-17.8.1

on:
  workflow_dispatch:
  push:
    branches: [gadget-17.8.1]

jobs:
  build-ios-gadget:
    runs-on: macos-latest
    steps:
      - name: Checkout (full, incl. submodules)
        uses: actions/checkout@v4
        with:
          ref: gadget-17.8.1
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Configure (ios-arm64, gadget, v8 disabled, no compat)
        run: |
          export IOS_CERTID=-
          ./configure \
            --host=ios-arm64 \
            --enable-gadget \
            -- -Dfrida-gum:v8=disabled \
               -Dfrida-core:compat=disabled

      - name: Build (default target compiles all incl. gadget)
        run: |
          export IOS_CERTID=-
          make

      - name: Stage + verify artifact
        run: |
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          # on-disk meson output is lowercase frida-gadget.dylib; rename to FridaGadget.dylib
          artifact=$(find build -iname frida-gadget.dylib | head -1)
          echo "artifact: $artifact"
          test -n "$artifact" || { echo "gadget dylib not found"; exit 1; }
          cp "$artifact" "$dist/FridaGadget.dylib"
          file "$dist/FridaGadget.dylib"
          size=$(stat -f%z "$dist/FridaGadget.dylib" 2>/dev/null || stat -c%s "$dist/FridaGadget.dylib")
          echo "size: $size bytes"
          if otool -L "$dist/FridaGadget.dylib" 2>/dev/null | grep -iqE 'v8\.so|v8\.dylib'; then
            echo "WARNING: v8 appears linked"
          else
            echo "OK: no v8 dependency detected (quickjs config)"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FridaGadget-17.8.1-ios-arm64-v8disabled
          path: dist/FridaGadget.dylib
